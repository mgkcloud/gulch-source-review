<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gulch game</title>
<style>
:root{--ink:#0b0d0c;--panel:#12150f;--line:#252a1f;--fg:#d8e0c8;--dim:#7d8a6a;--amber:#ffcc66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
#left{position:relative;min-width:0;height:100%;width:100%;overflow:hidden;background:var(--ink)}
#board{position:absolute;inset:0;display:block;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;background:linear-gradient(#0b0d0cec,#0b0d0c00);display:flex;gap:18px;align-items:baseline;font-size:12px;letter-spacing:.4px;pointer-events:none;z-index:2}
#hud b{color:var(--amber);font-weight:600}
#moduleErrors{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;height:132px;overflow-y:auto;background:linear-gradient(#0b0d0c00,#0b0d0cf2 40%);font-size:12.5px;color:var(--dim);z-index:2}
#log div{margin:1px 0}#log b{color:var(--fg);font-weight:600}
#controls{position:absolute;bottom:20px;right:10px;z-index:3;display:grid;grid-template-columns:repeat(3,36px);gap:4px}
#controls button{padding:9px}
#focusHint{position:absolute;top:34px;left:12px;font-size:10.5px;color:var(--dim);z-index:2}
#focusHint b{color:var(--amber)}
button,input{font:inherit}button{cursor:pointer}
#inventoryToggle{position:absolute;right:12px;top:55px;z-index:4;padding:8px 12px;background:#092724;color:#c5d8bc;border:1px solid #557d70;font-size:12px}
#inventoryPanel[hidden]{display:none}
#inventoryPanel{position:absolute;inset:12px;z-index:10;display:flex;flex-direction:column;background:#051c1bf5;color:#b6cbc1;border:3px double #56786f;box-shadow:0 0 0 6px #020e0dbb,0 12px 70px #000;isolation:isolate}
#inventoryPanel:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#80c9a906 3px,#80c9a906 4px)}
.inventory-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #42645b;background:#0c302c}
.inventory-header h1{margin:0;font-size:15px;letter-spacing:3px;color:#d4ddad}
#inventoryPanel button{background:#0b2926;color:#c0d1bd;border:1px solid #46695e;padding:7px 10px}
#inventoryPanel button:hover,#inventoryPanel button:focus-visible,#inventoryToggle:focus-visible{background:#194339;outline:2px solid #c6cf83;outline-offset:2px}
.inventory-body{display:grid;grid-template-columns:minmax(210px,40%) minmax(0,1fr);flex:1;min-height:0}
.inventory-equipment{padding:18px;overflow:auto;border-right:1px solid #42645b}
.inventory-label{font-size:11px;letter-spacing:2px;color:#779c8d;margin:0 0 16px}
#equipmentSlots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;align-content:start}
.equipment-slot{text-align:center;min-width:0;font-size:10px;color:#91afa0;overflow-wrap:anywhere}
.equipment-box{width:58px;height:58px;margin:0 auto 6px;display:grid;place-items:center;border:3px double #456a5e;background:#061714;box-shadow:inset 0 0 0 3px #0a2520;color:#d8d68f;font-size:25px}
.equipment-name{font-size:10px;color:#c8d2ba;margin-top:3px}
.inventory-items{display:flex;flex-direction:column;min-height:0;min-width:0;padding:16px}
#inventorySearch{width:100%;padding:9px 12px;background:#031512;color:#dae4d1;border:1px solid #496c60;border-radius:0;outline-offset:3px}
#inventorySearch::placeholder{color:#75998a}
#inventorySummary{font-size:11px;color:#7fa895;padding:10px 0;border-bottom:1px solid #36574d}
#inventoryList{overflow:auto;flex:1;min-height:0;padding:8px 0}
.inventory-category{font-size:12px;letter-spacing:1px;color:#83ae9e;background:#0b2925;margin:12px 0 5px;padding:6px 8px}
#inventoryPanel .inventory-item{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid #1c3a32;padding:9px 8px;background:transparent;font-size:12px}
#inventoryPanel .inventory-item[aria-pressed=true]{background:#193b30;color:#e1e5ae;box-shadow:inset 3px 0 #becf79}
.item-glyph{width:22px;flex-shrink:0;color:#b7ca83;text-align:center}.item-title{flex:1;overflow-wrap:anywhere}.item-meta{color:#82a995;font-size:10px;text-align:right}
#inventoryDetails{border-top:1px solid #42645b;padding:12px 0 0;font-size:12px;min-height:52px;max-height:130px;overflow:auto;white-space:pre-wrap;color:#9db7a7}
.inventory-footer{padding:8px 16px;border-top:1px solid #42645b;font-size:10px;color:#8ba994;letter-spacing:1px}
.inventory-empty{padding:24px 8px;color:#86a899;font-size:12px}
@media(max-width:700px){#hud{gap:7px;flex-wrap:wrap;font-size:10px}#moduleErrors{height:75px;font-size:11px}#controls{bottom:20px}#inventoryPanel{inset:6px}.inventory-body{grid-template-columns:minmax(135px,34%) minmax(0,1fr)}.inventory-equipment,.inventory-items{padding:10px}#equipmentSlots{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 5px}.equipment-box{width:44px;height:44px}.inventory-header{padding:10px}.inventory-header h1{font-size:12px;letter-spacing:1px}.item-meta{max-width:60px}}
</style>
</head>
<body>
<div id="left">
<canvas id="board"></canvas>
<div id="hud"><span>HP <b id="hp">–</b></span><span>MAP <b id="mapName">–</b></span><span>POS <b id="pos">–</b></span><span>TURN <b id="turn">–</b></span><span>PLAYERS <b id="clients">–</b></span></div>
<div id="focusHint"></div>
<div id="moduleErrors" role="alert"></div>
<div id="controls"><span></span><button data-move="0,-1">↑</button><span></span><button data-move="-1,0">←</button><button id="descendBtn">&gt;</button><button data-move="1,0">→</button><span></span><button data-move="0,1">↓</button></div>
<button id="inventoryToggle" type="button" aria-controls="inventoryPanel" aria-expanded="false">[I] Inventory</button>
<section id="inventoryPanel" role="dialog" aria-modal="true" aria-labelledby="inventoryTitle" hidden>
<header class="inventory-header"><h1 id="inventoryTitle">▣ EQUIPMENT & INVENTORY</h1><button id="inventoryClose" type="button">Close [I]</button></header>
<div class="inventory-body"><section class="inventory-equipment" aria-label="Equipped items"><h2 class="inventory-label">EQUIPMENT</h2><div id="equipmentSlots"></div></section><section class="inventory-items" aria-label="Carried items"><label for="inventorySearch" class="inventory-label">CARRIED ITEMS</label><input id="inventorySearch" type="search" placeholder="Search items or categories…" autocomplete="off"><div id="inventorySummary" aria-live="polite"></div><div id="inventoryList"></div><div id="inventoryDetails" aria-live="polite">Select an item to inspect it.</div></section></div>
<footer class="inventory-footer">[I / ESC] CLOSE · SELECT TO INSPECT · SHARED ROOM INVENTORY</footer>
</section>
</div>
<!-- GULCH_SCRIPTS -->
</body></html>
